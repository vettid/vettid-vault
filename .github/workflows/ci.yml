name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/lint_test.go checks that the pinned kernel_commit is in
          # HEAD's history (docs/KERNEL.md §6), which needs every commit.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: make vet
      - name: staticcheck
        run: make staticcheck
      - name: no vector-only code in library packages
        run: make check-tcb
      - name: go test -race (incl. vector regeneration)
        run: |
          go test -race -count=1 ./...
          go test -race -count=1 -tags vettid_testcost ./vault/... ./features/... ./enclave/...
          go test -race -count=1 -tags vmsvectors ./...
      - name: release channels (embedded constants, both channel builds)
        run: make channels
      - name: fuzz (short, execution-count budgets)
        run: make fuzz

  e2e:
    # V2 exit criteria against the real relay binary (go install of
    # github.com/vettid/vettid-relay/cmd/relay at the go.mod version).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: end-to-end (race)
        run: make e2e

  integration:
    # V3 exit test (VAULT-PLAN §4 V3): relay, parent and dev enclave
    # binaries, the member API stand-in and vaultctl against LocalStack.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      localstack:
        # public.ecr.aws/localstack/localstack:4.9@sha256:59373b4a27dba3ec15c4db0b7455f0cb68c8a42300e2cbbe362b440f9a131697
        # from VettID's mirror of the same digest (vettid.org .github/mirror)
        image: ghcr.io/vettid/mirror/localstack@sha256:59373b4a27dba3ec15c4db0b7455f0cb68c8a42300e2cbbe362b440f9a131697
        ports:
          - 4566:4566
        env:
          SERVICES: s3,sqs,dynamodb,ssm
          SQS_ENDPOINT_STRATEGY: path
          LOCALSTACK_HOST: 127.0.0.1:4566
        options: >-
          --memory 1536m
          --health-cmd "curl -sf http://127.0.0.1:4566/_localstack/health"
          --health-interval 2s --health-timeout 2s --health-retries 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: integration (LocalStack)
        env:
          VAULT_IT_LOCALSTACK: http://127.0.0.1:4566
        run: go test -count=1 -p 1 -tags 'devenclave integration' ./parent/ ./integration/ ./cmd/devstack/

  filter-arm64:
    # The vault process's system-call filter is a program per
    # architecture and the release image is arm64, while the jobs above
    # run on amd64: install the real filter on an arm64 kernel and run
    # the self-test's vault process under it. -v prints what this kernel
    # answers each probe without the filter.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: the filter, the vault process and the self-test on arm64
        run: |
          test "$(go env GOARCH)" = arm64
          go test -count=1 -p 1 -v ./internal/seccomp/...
          go test -count=1 -p 1 ./enclave/vaultproc/... ./internal/selftest/...
          go test -count=1 -p 1 -tags 'devenclave e2e' -run '^TestSelftest$' -v ./e2e/

  root:
    # The vault processes' uid rules need root (the supervisor switches
    # uids): ids never reused, children ended when their process ends.
    # The test binary is built as the runner's user, placed where the
    # vault uids can execute it, and only that test runs as root.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: vault processes under their own uids (as root)
        run: |
          d=$(mktemp -d /tmp/vault-root.XXXXXX)
          chmod 755 "$d"
          go test -c -o "$d/supervisor.test" ./enclave/supervisor/
          chmod 755 "$d/supervisor.test"
          sudo "$d/supervisor.test" -test.run '^(TestVaultProcessUIDs|TestKillUID|TestKillUIDRefuses|TestSpawnSurvivesThreadExit)$' -test.count=1 -test.v | tee "$d/out"
          for t in TestVaultProcessUIDs TestKillUID TestKillUIDRefuses TestSpawnSurvivesThreadExit; do
            grep -q -- "--- PASS: $t " "$d/out" || { echo "$t did not pass"; exit 1; }
          done

  enclave-image:
    # Dockerfile.enclave is reproducible: two clean builds give the same
    # binary (and the same image). The arm64 build's hash is what the
    # Graviton smoke host's build must match (docs/SMOKE.md).
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      # The Dockerfile's pinned base image, same digest, from VettID's
      # mirror (scripts/image-mirror.sh).
      VETTID_IMAGE_MIRROR: ghcr.io/vettid/mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: shellcheck
        run: shellcheck scripts/image-mirror.sh scripts/build-eif.sh scripts/smoke/run-on-host.sh scripts/compat-matrix.sh release/rebuild.sh release/kernel/build.sh release/kernel/check-config.sh release/kernel/check-current.sh release/kernel/eif-with-blobs.sh release/kernel/rebuild-check.sh
      - name: two clean builds, one binary
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          ctx="$(scripts/image-mirror.sh contexts Dockerfile.enclave)"
          frommirror=()
          if [ -n "$ctx" ]; then mapfile -t frommirror <<<"$ctx"; fi
          for i in 1 2; do
            docker build --no-cache -q "${frommirror[@]}" -f Dockerfile.enclave --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" -t "vve:$i" .
            c=$(docker create "vve:$i"); docker cp "$c:/vault-enclave" "ve$i"; docker rm "$c" >/dev/null
          done
          sha256sum ve1 ve2
          cmp ve1 ve2
      - name: release gate refuses placeholders (VAULT-MESSAGING §11.10.8)
        run: |
          ctx="$(scripts/image-mirror.sh contexts Dockerfile.enclave)"
          frommirror=()
          if [ -n "$ctx" ]; then mapfile -t frommirror <<<"$ctx"; fi
          for ch in prod staging; do
            if ! go run ./cmd/releasecfg check "$ch" >/dev/null 2>&1; then
              msg=$(CHANNEL=$ch scripts/build-eif.sh "out-$ch" 2>&1 || true)
              echo "$msg" | grep -q "still has placeholders" || { echo "build-eif.sh did not refuse $ch: $msg"; exit 1; }
              if docker build -q "${frommirror[@]}" -f Dockerfile.enclave --build-arg CHANNEL=$ch -t "vve-$ch" . >/dev/null 2>&1; then
                echo "Dockerfile.enclave built a $ch image with placeholders"; exit 1
              fi
              echo "$ch: refused while placeholders remain"
            else
              docker build -q "${frommirror[@]}" -f Dockerfile.enclave --build-arg CHANNEL=$ch --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" -t "vve-$ch" .
              # build-eif.sh for a complete channel gets as far as the two
              # binaries (no nitro-cli here: EIF_BUILDER names no image, so
              # the EIF step itself fails afterwards, as expected).
              msg=$(CHANNEL=$ch EIF_BUILDER=vettid-no-such-eif-builder scripts/build-eif.sh "out-$ch" 2>&1 || true)
              echo "$msg" | grep -q "binary sha256" || { echo "build-eif.sh did not build the $ch binaries: $msg"; exit 1; }
              test -s "out-$ch/vault-enclave" && test -s "out-$ch/vault-parent"
              echo "$ch: build-eif.sh built both binaries"
            fi
          done

  gitleaks:
    # Pinned binary over the full history reachable from the checked-out
    # commit (main plus this branch); not over other branches, whose
    # unmerged test vectors would otherwise fail every PR against an
    # allowlist they don't carry yet. Each branch is scanned in its own PR.
    # (The gitleaks-action fails on a branch's first push, where there is
    # no "before" commit, hence the binary.)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks v8.30.1 (checksum-verified)
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: scan the history of HEAD
        run: ./gitleaks git --redact --verbose --log-opts="HEAD" .
