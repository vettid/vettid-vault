# gitleaks configuration for vettid-vault.
# Extends the default ruleset. The only allowlisted values are fixed,
# test-only vector values from testdata/vectors (VAULT-MESSAGING §16): HPKE
# intermediate values derived from the public all-0x05 key seed and all-0x07
# encapsulation randomness, and the PUBLIC keys (SPKI) of the §16
# release-update test keys (scalars 32 x 0x21 and 32 x 0x22) and the PUBLIC
# key of the §11.11.2 recovery vector's browser key (scalar 32 x 0x23), and
# the PUBLIC credential key of the §10.11 LEASH vectors (seed 32 x 0x30,
# leash.json), and the PUBLIC key (SPKI) of the 0.15.0 app-key vector
# (scalar 32 x 0x41, appkey.json), and the placeholder APNs token of
# PUSH-GATEWAY 0.4.0 §15's registration vector (random, no device).
# They are public by design and are regenerated deterministically by
# `go generate ./vms/vectors`. Also allowlisted: the example ULID of
# VAULT-MESSAGING §5.3, which tests use as a dummy id (for instance as a
# `secret_id`, which the generic rule mistakes for a key).
[extend]
useDefault = true

[[allowlists]]
description = "VAULT-MESSAGING §16 test vectors (test-only, public)"
regexTarget = "match"
regexes = [
  '''3239a1c6d8d76895e408c7e65ee38d8b43f4732c7a74c5ccfbac6bd63f743bce''',
  '''f8cfa15ec73bf1031bc50dfc462438a3d6a3d933f7edf6b28bc149fd7400e2a6''',
  '''1d7856a1a77eee3accf4e69fb2353f2421e3f15584739e5c6df73d487b4b66b4''',
  '''MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAERi26GuT8GpaLTazyDN1tvh''',
  '''MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE1lqTl3yqPRsIGFL/V6eeRl8W''',
  '''042464a2f8813e007299b9c0beef9c8d6d8d17470b32bba0329c145f0cfc60b683f831a3''',
  '''G6QHW3fJ4/s\+zeFc2vUiHzwQNz5iP3sOHvdjZrCvcTc=''',
  '''01JB2Z6V9K3M4N5P6Q7R8S9T0V''',
  '''MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEZpI3VGYrivhlu/KoncHtr3sZZHVE''',
  '''740f4707bebcf74f9b7c25d48e3358945f6aa01da5ddb387462c7eaf61bb78ad''',
]

# Release R test vectors (VAULT-MESSAGING 0.33.0 §16, vettid-vault #96):
# deterministic values derived from fixed, public, TEST-ONLY inputs
# (pepper 32 x 0x32, unlock secrets 32 x 0x42 and 32 x 0x45, PIN 123456,
# password "correct horse battery staple") and two example passwords of
# the shared verdict file. Not secrets. Scoped to the generic-api-key
# rule, to these three files and to these exact values together.
[[allowlists]]
description = "Release R test vectors (test-only, deterministic)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^testdata/vectors/unlock\.json$''',
  '''^testdata/vectors/recovery\.json$''',
  '''^testdata/passwords/verdicts\.json$''',
]
regexTarget = "match"
regexes = [
  '''f01975109b4575d994ade44aeae5d667eb56f14b610d1004694a707e9702e624''',
  '''89f9fa1389f2e7ecfd0521ab27b39207d867a8acd3f99cd23ba19b3c357ccfde''',
  '''dd657b8c27f970d60c271e531e9477aeef25da911a5e5041be3fc7b886044802''',
  '''c12589e53da8326b90b0e362e09f83d1ec315e22936c6069decaa686d7a01ef3''',
  '''6286862e0e08397dc6b79b2b39f3e37ea03fd8a21ca6c1d09bf33fe9d89e5452''',
  '''QWERTY123456''',
  '''violet-Kestrel-91-moss''',
]

# §10.4 member-authentication vector (connauth.json, vettid-vault #152):
# the challenge's request_id, a fixed example ULID (not a secret) that the
# generic rule mistakes for a key next to the name ConnAuthRequestID.
# Scoped to the generic-api-key rule, to the vector parameters and to this
# exact value together.
[[allowlists]]
description = "connauth vector request_id (test-only ULID)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^vms/vectors/params\.go$''',
]
regexTarget = "match"
regexes = [
  '''01JB2Z6V9K3M4N5P6Q7R8S9T70''',
]

# §10.19 vote vectors (VAULT-MESSAGING 0.81.0 §16; testdata/vote/vectors.json,
# a byte-for-byte copy of vettid/service-vault vote/testdata/vectors.json).
# Every value is a fixed TEST-ONLY seed, key, secret or hash printed in the
# public spec ("The values are for test use only"); the generic rule takes
# `record_secret`, `seed` and `key` for credentials. Scoped to the
# generic-api-key rule and to this one file.
[[allowlists]]
description = "vote vectors (test-only, public)"
targetRules = ["generic-api-key"]
paths = [
  '''^testdata/vote/vectors\.json$''',
]
