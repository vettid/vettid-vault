# The EIF toolchain (VAULT-RELEASES §5.1). Everything that goes into an
# EIF besides the enclave image is pinned here: the build container, the
# Amazon Linux 2023 repository snapshot, the aws-nitro-enclaves-cli
# packages (by RPM SHA-256) and the kernel, init and module blobs that
# nitro-cli puts into the EIF (they are part of PCR0). Changing any of
# these changes every PCR0, so it is a release change like any other.
#
# The blobs are not the ones in the aws-nitro-enclaves-cli-devel RPM
# (Linux 4.14.256, built in January 2022; the 4.14 series is no longer
# maintained). They are vettid-vault's own blob set blobs_version (Linux
# 6.6.158 with a hardened config, command line, init, linuxkit and an
# empty nsm.ko: the NSM driver is built in), built from kernel.org source
# by release/kernel at kernel_commit (kernel.lock: kernel_lock_sha256;
# docs/KERNEL.md) and published
# with the kernel's corresponding source as the vettid-vault release
# kernel/6.6.158-1. Releases before staging 13 used AWS's v6.6.79 set.
# The builder downloads blobs_url, checks the archive's SHA-256 below,
# removes the RPM's blobs and installs blobs_dir from the archive in
# their place.
#
# release/Dockerfile.eif-builder checks every sha256 line below; the
# release workflow records this file's SHA-256 in measurements.json.
#
# KEY=VALUE lines:
base_image=public.ecr.aws/docker/library/amazonlinux:2023@sha256:5b29412077a463b4a3a8fbc99a8cdf4b929f38a3ecc8dac10328d8f36b0099b8
releasever=2023.12.20260918
arch=aarch64
nitro_cli_version=1.5.0-0.amzn2023
blobs_version=vettid-6.6.158-1
blobs_url=https://github.com/vettid/vettid-vault/releases/download/kernel/6.6.158-1/vettid-enclave-blobs-6.6.158-1.txz
blobs_dir=vettid-enclave-blobs/aarch64
kernel_lock_sha256=1c088af2f4f147d98ec9a4a51cc60a83592e7e6cfbb2781f09f19f1266a31a93
kernel_commit=a3442770be214117cb373c042b07132fdb65d4e4
# The recipe's source archive in the blob set's release (corresponding
# source; the release workflow attaches it to each vault release).
kernel_source_sha256=13eb3de2ef562b61fda4fcabe0feee96f6c76a8ccc7e3aaaab79a338d64804a5
# The kernel these blobs carry is named in release/enclave-kernel, which
# the enclave binary embeds (scripts/lint_test.go keeps the two in step).
