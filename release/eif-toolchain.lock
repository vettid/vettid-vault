# The EIF toolchain (VAULT-RELEASES §5.1). Everything that goes into an
# EIF besides the enclave image is pinned here: the build container, the
# Amazon Linux 2023 repository snapshot, the aws-nitro-enclaves-cli
# packages (by RPM SHA-256) and the kernel, init and module blobs that
